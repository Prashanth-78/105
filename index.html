
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Dash - Arcade Game</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #080b18;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.game-container {
    width: 95%;
    max-width: 650px;
    text-align: center;
}

h1 {
    color: #00f7ff;
    margin-bottom: 12px;
    letter-spacing: 4px;
    text-shadow: 0 0 15px #00f7ff;
}

.stats {
    display: flex;
    justify-content: space-around;
    margin: 12px 0;
    font-size: 18px;
}

canvas {
    width: 100%;
    background: #10172b;
    border: 2px solid #00f7ff;
    border-radius: 12px;
    box-shadow: 0 0 25px #00f7ff55;
}

button {
    margin-top: 15px;
    padding: 12px 30px;
    background: #00f7ff;
    color: #080b18;
    border: none;
    border-radius: 8px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: white;
    transform: scale(1.05);
}

p {
    margin-top: 12px;
    color: #aaa;
    font-size: 14px;
}
</style>
</head>

<body>

<div class="game-container">

<h1>NEON DASH</h1>

<div class="stats">
    <span>Score: <b id="score">0</b></span>
    <span>Coins: <b id="coins">0</b></span>
    <span>Best: <b id="best">0</b></span>
</div>

<canvas id="game" width="600" height="450"></canvas>

<button onclick="restartGame()">START / RESTART</button>

<p>Use ← → arrow keys or A / D to move. Dodge red blocks and collect gold coins!</p>

</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let player, obstacles, coins;
let score = 0;
let coinCount = 0;
let speed = 3;
let gameOver = false;
let playing = false;
let keys = {};
let frame = 0;

let best = Number(localStorage.getItem("neonBest")) || 0;
document.getElementById("best").textContent = best;

function restartGame() {
    player = {
        x: 275,
        y: 370,
        width: 45,
        height: 45,
        speed: 6
    };

    obstacles = [];
    coins = [];

    score = 0;
    coinCount = 0;
    speed = 3;
    frame = 0;

    gameOver = false;
    playing = true;

    document.getElementById("score").textContent = 0;
    document.getElementById("coins").textContent = 0;

    requestAnimationFrame(loop);
}

document.addEventListener("keydown", e => {
    keys[e.key.toLowerCase()] = true;
});

document.addEventListener("keyup", e => {
    keys[e.key.toLowerCase()] = false;
});

function spawnObjects() {
    if (frame % 65 === 0) {
        obstacles.push({
            x: Math.random() * 550,
            y: -40,
            width: 35,
            height: 35
        });
    }

    if (frame % 100 === 0) {
        coins.push({
            x: Math.random() * 560,
            y: -20,
            radius: 10
        });
    }
}

function collision(a, b) {
    return (
        a.x < b.x + b.width &&
        a.x + a.width > b.x &&
        a.y < b.y + b.height &&
        a.y + a.height > b.y
    );
}

function drawPlayer() {
    ctx.fillStyle = "#00f7ff";
    ctx.shadowColor = "#00f7ff";
    ctx.shadowBlur = 20;

    ctx.fillRect(
        player.x,
        player.y,
        player.width,
        player.height
    );

    ctx.shadowBlur = 0;
}

function drawObstacles() {
    ctx.fillStyle = "#ff3155";
    ctx.shadowColor = "#ff3155";
    ctx.shadowBlur = 12;

    obstacles.forEach(o => {
        ctx.fillRect(o.x, o.y, o.width, o.height);
        o.y += speed;
    });

    ctx.shadowBlur = 0;
}

function drawCoins() {
    coins.forEach(c => {
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2);
        ctx.fillStyle = "#ffd700";
        ctx.shadowColor = "#ffd700";
        ctx.shadowBlur = 15;
        ctx.fill();
        ctx.shadowBlur = 0;

        c.y += speed;
    });
}

function update() {
    if (keys["arrowleft"] || keys["a"]) {
        player.x -= player.speed;
    }

    if (keys["arrowright"] || keys["d"]) {
        player.x += player.speed;
    }

    player.x = Math.max(
        0,
        Math.min(canvas.width - player.width, player.x)
    );

    spawnObjects();

    obstacles.forEach(o => {
        if (collision(player, o)) {
            gameOver = true;
        }
    });

    coins = coins.filter(c => {
        let dx = player.x + player.width / 2 - c.x;
        let dy = player.y + player.height / 2 - c.y;

        if (Math.sqrt(dx * dx + dy * dy) < 28) {
            coinCount++;
            document.getElementById("coins").textContent = coinCount;
            return false;
        }

        return c.y < canvas.height + 20;
    });

    obstacles = obstacles.filter(o => o.y < canvas.height + 50);

    score++;
    speed = 3 + Math.floor(score / 500) * 0.5;

    document.getElementById("score").textContent = score;
}

function drawBackground() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = "#1c2945";
    ctx.lineWidth = 1;

    for (let x = 0; x < canvas.width; x += 40) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
    }

    for (let y = 0; y < canvas.height; y += 40) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
    }
}

function endGame() {
    playing = false;

    if (score > best) {
        best = score;
        localStorage.setItem("neonBest", best);
        document.getElementById("best").textContent = best;
    }

    ctx.fillStyle = "rgba(0,0,0,0.75)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.textAlign = "center";

    ctx.fillStyle = "#ff3155";
    ctx.font = "bold 48px Arial";
    ctx.fillText("GAME OVER", 300, 200);

    ctx.fillStyle = "white";
    ctx.font = "22px Arial";
    ctx.fillText("Final Score: " + score, 300, 250);

    ctx.font = "18px Arial";
    ctx.fillText("Press START / RESTART to play again", 300, 300);
}

function loop() {
    if (!playing) return;

    drawBackground();
    update();
    drawObstacles();
    drawCoins();
    drawPlayer();

    frame++;

    if (gameOver) {
        endGame();
        return;
    }

    requestAnimationFrame(loop);
}

drawBackground();

ctx.fillStyle = "white";
ctx.font = "25px Arial";
ctx.textAlign = "center";
ctx.fillText("PRESS START TO PLAY", 300, 220);

</script>
</body>
</html>
