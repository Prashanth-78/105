<!DOCTYPE html>
<html>
<head>
<title>Stick Cricket Game</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial;
    background: #172c38;
    color: white;
    text-align: center;
}

h1 {
    color: #ffcc00;
}

.game {
    width: 95%;
    max-width: 750px;
    margin: 20px auto;
    background: #243c48;
    padding: 15px;
    border-radius: 15px;
}

.scoreboard {
    display: flex;
    justify-content: space-around;
    font-size: 20px;
    background: #111;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 15px;
}

.ground {
    height: 350px;
    background: linear-gradient(#55b94b 0%, #278c38 100%);
    position: relative;
    overflow: hidden;
    border: 4px solid white;
    border-radius: 10px;
}

.pitch {
    position: absolute;
    width: 140px;
    height: 220px;
    background: #d5b17c;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
}

.batsman {
    position: absolute;
    bottom: 45px;
    left: 55%;
    font-size: 55px;
    z-index: 3;
    transform-origin: bottom center;
}

.bowler {
    position: absolute;
    top: 35px;
    left: 48%;
    font-size: 48px;
}

.ball {
    position: absolute;
    width: 15px;
    height: 15px;
    background: red;
    border-radius: 50%;
    top: 65px;
    left: 49%;
    display: none;
    z-index: 5;
}

.ball.bowling {
    display: block;
    animation: bowl 0.8s linear forwards;
}

@keyframes bowl {
    from {
        top: 65px;
        left: 49%;
    }
    to {
        top: 270px;
        left: 53%;
    }
}

.batsman.hit {
    animation: swing 0.3s;
}

@keyframes swing {
    50% {
        transform: rotate(-60deg);
    }
}

#result {
    font-size: 28px;
    font-weight: bold;
    color: yellow;
    height: 40px;
    margin: 12px;
}

button {
    background: #ffcc00;
    color: black;
    border: none;
    padding: 15px 30px;
    font-size: 20px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
    margin: 8px;
}

button:hover {
    background: orange;
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.instructions {
    color: #ddd;
}
</style>
</head>

<body>

<h1>🏏 STICK CRICKET</h1>

<div class="game">

    <div class="scoreboard">
        <span>Runs: <b id="score">0</b></span>
        <span>Wickets: <b id="wickets">0</b></span>
        <span>Balls: <b id="balls">0</b>/6</span>
    </div>

    <div class="ground">

        <div class="bowler">🏃</div>

        <div class="pitch"></div>

        <div class="batsman" id="batsman">🏏</div>

        <div class="ball" id="ball"></div>

    </div>

    <div id="result">Ready to play?</div>

    <button id="bowlBtn" onclick="bowlBall()">BOWL</button>

    <button id="hitBtn" onclick="hitBall()" disabled>HIT! 🏏</button>

    <button onclick="restart()">RESTART</button>

    <p class="instructions">
        Click HIT when the ball comes near the batsman!
        <br>
        You can also press SPACE to hit.
    </p>

</div>

<script>

let score = 0;
let wickets = 0;
let balls = 0;

let bowling = false;
let canHit = false;
let gameOver = false;
let hitTimer;
let bowlTimeout;

const ball = document.getElementById("ball");
const batsman = document.getElementById("batsman");
const result = document.getElementById("result");

function updateScore() {
    document.getElementById("score").textContent = score;
    document.getElementById("wickets").textContent = wickets;
    document.getElementById("balls").textContent = balls;
}

function bowlBall() {

    if (gameOver || bowling) return;

    bowling = true;
    canHit = false;

    result.textContent = "Ball coming...";
    ball.classList.remove("bowling");

    void ball.offsetWidth;

    ball.classList.add("bowling");

    document.getElementById("bowlBtn").disabled = true;
    document.getElementById("hitBtn").disabled = false;

    // The ball becomes hittable near the batsman.
    hitTimer = setTimeout(() => {
        canHit = true;
        result.textContent = "HIT NOW!";
    }, 450);

    bowlTimeout = setTimeout(() => {
        if (bowling) {
            missBall();
        }
    }, 800);
}

function hitBall() {

    if (!canHit || gameOver) return;

    canHit = false;
    bowling = false;

    clearTimeout(hitTimer);
    clearTimeout(bowlTimeout);

    ball.classList.remove("bowling");

    batsman.classList.add("hit");

    setTimeout(() => {
        batsman.classList.remove("hit");
    }, 300);

    balls++;

    // Timing determines the score.
    let runs = Math.floor(Math.random() * 7);

    if (runs === 5) runs = 4;

    score += runs;

    if (runs === 0) {
        result.textContent = "DOT BALL!";
    }
    else if (runs === 4) {
        result.textContent = "🔥 FOUR!";
    }
    else if (runs === 6) {
        result.textContent = "🚀 SIX!";
    }
    else {
        result.textContent = runs + " RUNS!";
    }

    updateScore();

    nextBall();
}

function missBall() {

    if (!bowling) return;

    bowling = false;
    canHit = false;

    clearTimeout(hitTimer);
    clearTimeout(bowlTimeout);

    ball.classList.remove("bowling");

    balls++;
    wickets++;

    result.textContent = "❌ OUT!";

    updateScore();

    nextBall();
}

function nextBall() {

    document.getElementById("hitBtn").disabled = true;

    if (balls >= 6 || wickets >= 2) {
        endGame();
        return;
    }

    setTimeout(() => {
        if (!gameOver) {
            document.getElementById("bowlBtn").disabled = false;
            result.textContent = "Ready for next ball!";
        }
    }, 900);
}

function endGame() {

    gameOver = true;

    document.getElementById("bowlBtn").disabled = true;
    document.getElementById("hitBtn").disabled = true;

    result.textContent = "🏆 INNINGS OVER! Score: " + score;
}

function restart() {
    clearTimeout(hitTimer);
    clearTimeout(bowlTimeout);

    score = 0;
    wickets = 0;
    balls = 0;

    bowling = false;
    canHit = false;
    gameOver = false;

    ball.classList.remove("bowling");

    updateScore();

    document.getElementById("bowlBtn").disabled = false;
    document.getElementById("hitBtn").disabled = true;

    result.textContent = "Ready to play?";

}

document.addEventListener("keydown", function(event) {
    if (event.code === "Space") {
        event.preventDefault();
        hitBall();
    }
});

</script>

</body>
</html>
